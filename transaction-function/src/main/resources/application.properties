quarkus.lambda.handler=transaction
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
telegram.api-url=${TELEGRAM_API_URL:https://api.telegram.org/bot}
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
%dev.quarkus.lambda.mock-event-server.dev-port=18082
%dev.quarkus.devservices.enabled=false
